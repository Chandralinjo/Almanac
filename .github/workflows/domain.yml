name: Domain, storage and ingredient screens
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m pip install kivy==2.3.1
      - name: Exercise Kivy ingredient screens
        run: python -m unittest tests.ui_smoke -v
        env:
          SDL_VIDEODRIVER: offscreen
          KIVY_NO_ARGS: '1'
          KIVY_HOME: ${{ runner.temp }}/kivy
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
